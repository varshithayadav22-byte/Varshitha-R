<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f7fb;
        color: #333;
    }

    header {
        background: #4a90e2;
        color: white;
        padding: 20px;
        text-align: center;
    }

    nav {
        display: flex;
        justify-content: center;
        background: #357ABD;
        padding: 10px;
    }

    nav a {
        color: white;
        margin: 0 15px;
        text-decoration: none;
        font-weight: bold;
    }

    nav a:hover {
        text-decoration: underline;
    }

    .container {
        padding: 20px;
        max-width: 1000px;
        margin: auto;
    }

    .card {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
        margin-bottom: 10px;
        color: #4a90e2;
    }

    ul {
        list-style: none;
    }

    li {
        padding: 8px;
        border-bottom: 1px solid #ddd;
    }

    .todo input {
        padding: 10px;
        width: 70%;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .todo button {
        padding: 10px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .todo button:hover {
        background: #357ABD;
    }

    footer {
        text-align: center;
        padding: 15px;
        background: #4a90e2;
        color: white;
        margin-top: 20px;
    }
</style>

</head>
<body>

<header>
    <h1>📚 Study Hub</h1>
    <p>Your personal learning space</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Subjects</a>
    <a href="#">Notes</a>
    <a href="#">To-Do</a>
</nav>

<div class="container">

    <div class="card">
        <h2>📖 Subjects</h2>
        <ul>
            <li>Mathematics</li>
            <li>Science</li>
            <li>Computer Science</li>
            <li>History</li>
        </ul>
    </div>

    <div class="card">
        <h2>📝 Notes</h2>
        <p>Keep your important study notes here.</p>
        <textarea style="width:100%; height:100px; padding:10px;"></textarea>
    </div>

    <div class="card todo">
        <h2>✅ To-Do List</h2>
        <input type="text" id="taskInput" placeholder="Add a task...">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>

</div>

<footer>
    <p>© 2026 Study Hub | Stay Focused 🚀</p>
</footer>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if(task === "") return;

    let li = document.createElement("li");
    li.textContent = task;

    li.onclick = function() {
        this.style.textDecoration = "line-through";
    };

    document.getElementById("taskList").appendChild(li);
    input.value = "";
}
</script>

</body>
</html>
