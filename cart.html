<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shopping Cart</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
}

.cart{
    width:400px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:8px;
    margin:8px 0;
}

button{
    width:100%;
    padding:10px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.total{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<div class="cart">

<h2>Shopping Cart</h2>

<label>Product Name</label>
<input type="text" id="name">

<label>Price</label>
<input type="number" id="price">

<label>Quantity</label>
<input type="number" id="qty">

<button onclick="calculate()">Calculate Total</button>

<div class="total" id="total">Total: $0</div>

</div>

<script>

function calculate(){

let price = document.getElementById("price").value;
let qty = document.getElementById("qty").value;

let total = price * qty;

document.getElementById("total").innerHTML = "Total: $" + total;

}

</script>

</body>
</html>
