<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 8px;
            width: 80%;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Palindrome Checker</h2>
    <input type="text" id="word" placeholder="Enter a word">
    <br>
    <button onclick="checkPalindrome()">Check</button>
    <p id="result"></p>
</div>

<script>
function checkPalindrome() {
    
    let word = document.getElementById("word").value;

  
    let lowerWord = word.toLowerCase();

    let reversed = "";
    for (let i = lowerWord.length - 1; i >= 0; i--) {
        reversed += lowerWord[i];
    }

    if (lowerWord === reversed) {
        document.getElementById("result").innerHTML = word + " → Palindrome";
    } else {
        document.getElementById("result").innerHTML = word + " → Not Palindrome";
    }
}
</script>

</body>
</html>
