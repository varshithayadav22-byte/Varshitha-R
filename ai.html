<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Text Summarizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 600px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      margin: 15px 0;
      padding: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #3b82f6;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    #outputText {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🧠 AI Text Summarizer</h1>

    <textarea id="inputText" placeholder="Paste your text here..."></textarea>

    <button onclick="summarizeText()">Summarize</button>

    <h2>Summary:</h2>
    <div id="outputText"></div>
  </div>

  <script>
    async function summarizeText() {
      const inputText = document.getElementById("inputText").value;
      const outputDiv = document.getElementById("outputText");

      if (!inputText) {
        outputDiv.innerText = "Please enter some text.";
        return;
      }

      outputDiv.innerText = "Summarizing...";

      try {
        const response = await fetch("https://api-inference.huggingface.co/models/facebook/bart-large-cnn", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer YOUR_API_KEY"
          },
          body: JSON.stringify({
            inputs: inputText
          })
        });

        const data = await response.json();

        if (data.error) {
          outputDiv.innerText = "Error: " + data.error;
        } else {
          outputDiv.innerText = data[0].summary_text;
        }

      } catch (error) {
        outputDiv.innerText = "Something went wrong!";
      }
    }
  </script>

</body>
</html>
