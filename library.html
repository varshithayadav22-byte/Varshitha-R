<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Library</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f4f4;
}

header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.library{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.category{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.category h2{
    text-align:center;
    color:#2c3e50;
}

.book{
    background:#ecf0f1;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
}

.book:hover{
    background:#d0e6ff;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>📚 Online Library</h1>
<p>Explore Different Types of Books</p>
</header>

<section class="library">

<div class="category">
<h2>Fiction</h2>
<div class="book">Harry Potter</div>
<div class="book">The Hobbit</div>
<div class="book">The Alchemist</div>
</div>

<div class="category">
<h2>Science</h2>
<div class="book">A Brief History of Time</div>
<div class="book">The Selfish Gene</div>
<div class="book">Cosmos</div>
</div>

<div class="category">
<h2>History</h2>
<div class="book">Sapiens</div>
<div class="book">Guns, Germs, and Steel</div>
<div class="book">The Silk Roads</div>
</div>

<div class="category">
<h2>Technology</h2>
<div class="book">Clean Code</div>
<div class="book">Introduction to Algorithms</div>
<div class="book">The Pragmatic Programmer</div>
</div>

</section>

</body>
</html>
