<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random User Generator</title>

<style>

:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#222;
}

body.dark{
  --bg:#1e1e1e;
  --card:#2c2c2c;
  --text:#ffffff;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
  text-align:center;
}

.buttons{
  margin-bottom:20px;
}

button{
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:6px;
  background:#007BFF;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#0056b3;
  transform:scale(1.05);
}

#users{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:10px;
  padding:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.card img{
  border-radius:50%;
  width:100px;
}

.spinner{
  display:none;
  margin:20px;
}

.loader{
  border:5px solid #ddd;
  border-top:5px solid #007BFF;
  border-radius:50%;
  width:40px;
  height:40px;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="container">

<h1>Random User Generator</h1>

<div class="buttons">
<button onclick="generateUser()">Generate User</button>
<button onclick="toggleDarkMode()">Dark / Light Mode</button>
</div>

<div class="spinner" id="spinner">
<div class="loader"></div>
</div>

<div id="users"></div>

</div>

<script>

function generateUser(){

const spinner = document.getElementById("spinner");
spinner.style.display = "block";

fetch("https://randomuser.me/api/")
.then(res => res.json())
.then(data => {

spinner.style.display = "none";

const user = data.results[0];

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<img src="${user.picture.large}">
<h3>${user.name.first} ${user.name.last}</h3>
<p>${user.email}</p>
<p>${user.location.country}</p>
`;

document.getElementById("users").appendChild(card);

});

}

function toggleDarkMode(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
