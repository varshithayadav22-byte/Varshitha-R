<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Product Search</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
transition:0.3s;
}

.dark{
background:#1e1e1e;
color:white;
}

.container{
max-width:1000px;
margin:auto;
text-align:center;
}

h1{
margin-bottom:20px;
}

.search-box{
width:60%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:20px;
}

.toggle-btn{
padding:10px 15px;
border:none;
background:#333;
color:white;
border-radius:6px;
cursor:pointer;
margin-bottom:20px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
transition:0.3s;
}

.dark .card{
background:#2c2c2c;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 6px 16px rgba(0,0,0,0.2);
}

.card h3{
margin-bottom:10px;
}

.card button{
padding:8px 12px;
border:none;
background:#007bff;
color:white;
border-radius:6px;
cursor:pointer;
}

.card button:hover{
background:#0056b3;
}

.no-result{
margin-top:20px;
font-weight:bold;
color:red;
}

@media(max-width:600px){
.search-box{
width:90%;
}
}

</style>
</head>

<body>

<div class="container">

<h1>Product Search</h1>

<button class="toggle-btn" onclick="toggleMode()">Dark / Light Mode</button>

<br>

<input 
type="text" 
class="search-box" 
id="searchInput" 
placeholder="Search products..."
onkeyup="filterProducts()"
/>

<div class="products" id="productList"></div>

<p class="no-result" id="noResult" style="display:none;">No products found</p>

</div>

<script>

const products = [
"Laptop",
"Phone",
"Headphones",
"Keyboard",
"Mouse",
"Camera",
"Smartwatch",
"Tablet",
"Speaker",
"Monitor"
];

const productList = document.getElementById("productList");

function displayProducts(list){

productList.innerHTML="";

list.forEach(product => {

const card = document.createElement("div");
card.className="card";

card.innerHTML=`
<h3>${product}</h3>
<button onclick="alert('${product} added!')">Add</button>
`;

productList.appendChild(card);

});

}

displayProducts(products);


function filterProducts(){

const search = document
.getElementById("searchInput")
.value
.toLowerCase();

const filtered = products.filter(product =>
product.toLowerCase().includes(search)
);

displayProducts(filtered);

document.getElementById("noResult").style.display =
filtered.length === 0 ? "block" : "none";

}

function toggleMode(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
